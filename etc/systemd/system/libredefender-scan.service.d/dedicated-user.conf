[Service]
# Dedicated least-privilege scanner (not root, not your login user)
User=libredefender
Group=libredefender
Environment=HOME=/var/lib/libredefender
Environment=XDG_CONFIG_HOME=/var/lib/libredefender/.config
Environment=XDG_DATA_HOME=/var/lib/libredefender/.local/share

# Clear the unit's "scan /" and use config paths instead
ExecStart=
ExecStart=/usr/bin/libredefender scan

# Read any file for scanning without full root (bypasses DAC reads only)
AmbientCapabilities=CAP_DAC_READ_SEARCH
CapabilityBoundingSet=CAP_DAC_READ_SEARCH

# Lock the filesystem view down; state dir is the only RW path we need
ProtectSystem=strict
ProtectHome=read-only
ReadWritePaths=/var/lib/libredefender
ReadOnlyPaths=/var/lib/clamav /home/panda

# No network needed for an offline signature scan
PrivateNetwork=true
RestrictAddressFamilies=AF_UNIX
SystemCallFilter=@system-service
SystemCallFilter=~@privileged @resources
