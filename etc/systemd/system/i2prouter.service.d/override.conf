[Service]
RuntimeDirectory=i2p
RuntimeDirectoryMode=0700
Restart=on-failure
RestartSec=10
TimeoutStopSec=120

# Raise JVM heap (package default is 128m)
ExecStart=
ExecStart=/usr/bin/java-service-wrapper /opt/i2p/wrapper.config \
    wrapper.name=i2prouter \
    wrapper.syslog.ident=i2prouter \
    wrapper.daemonize=TRUE \
    TZ=UTC \
    wrapper.java.initmemory=512 \
    wrapper.java.maxmemory=512

LimitNOFILE=65536
MemoryMax=1536M

# Hardening (JVM needs executable memory — no MemoryDenyWriteExecute / no tight syscall filter)
NoNewPrivileges=true
PrivateTmp=true
PrivateDevices=true
DeviceAllow=/dev/null rw
DeviceAllow=/dev/urandom r
ProtectSystem=strict
ProtectHome=true
ReadWritePaths=/opt/i2p /run/i2p
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
ProtectHostname=true
ProtectClock=true
ProtectKernelLogs=true
RestrictSUIDSGID=true
LockPersonality=true
RestrictRealtime=true
SystemCallArchitectures=native
CapabilityBoundingSet=
AmbientCapabilities=
UMask=0077
