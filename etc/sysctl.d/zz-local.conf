# /etc/sysctl.d/zz-local.conf
# Local overrides only. zz-* sorts after package elasticsearch.conf.
# Intentionally omitted:
#   vm.swappiness          — CachyOS zram udev sets 150
#   vm.vfs_cache_pressure  — already 50 in 70-cachyos-settings
#   fs.file-max, pid_max, inotify defaults — already raised by distro
# Do not set dirty_*_bytes=0 here (kernel returns EINVAL); setting
# dirty_ratio / dirty_background_ratio clears the byte limits.

vm.min_free_kbytes = 262144

# --- VM: prefer ratio-based dirty limits on 128G ---
# vm.dirty_ratio = 10
# vm.dirty_background_ratio = 3

# Proton / Elasticsearch / heavy mappers (must beat package elasticsearch.conf)
vm.max_map_count = 2147483642

# --- Network ---
net.ipv4.tcp_congestion_control = bbr
net.core.default_qdisc = fq
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_wmem = 4096 16384 41943040
net.ipv4.igmp_max_memberships = 2048
net.ipv4.ip_forward = 1
net.core.rmem_max = 67108864
net.core.wmem_max = 67108864

# Yggdrasil
net.ipv6.conf.all.disable_ipv6 = 0
net.ipv6.conf.default.disable_ipv6 = 0

# IDE / Syncthing / big trees (distro default is 524288)
fs.inotify.max_user_watches = 2097152
fs.inotify.max_user_instances = 2048

# Gaming scheduler responsiveness
kernel.sched_autogroup_enabled = 0
