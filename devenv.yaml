# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
inputs:
  devenv:
    url: github:cachix/devenv/v2.4.0
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
  nix2container:
    url: github:nlewo/nix2container/42d1df94f001a9416ef08be7b305144074aca9d2
    inputs:
      nixpkgs:
        follows: nixpkgs
  mk-shell-bin:
    url: github:rrbutani/nix-mk-shell-bin
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  pre-commit-hooks:
    follows: git-hooks
