name: Workflow lint

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
  pull_request:
    paths:
      - '.github/workflows/**'

permissions: {}

concurrency:
  group: workflow-lint-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    permissions:
      contents: read
    uses: bolens/.github/.github/workflows/reusable-actionlint.yml@3f2e5f3e61c419f3678ea8f472d24562254624c6
    with:
      security-audit: true
