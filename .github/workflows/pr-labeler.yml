name: Pull request labels

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-labels-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    uses: bolens/.github/.github/workflows/reusable-pr-labeler.yml@1c581eb7bf03b9643cca45755168d4b6e4a88e1a
